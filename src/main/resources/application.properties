spring.application.name=practica3

# Configuración de conexión adaptada para MySQL (Local / Render)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mantenimiento}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:HGTRRXA8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Dialecto específico para MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Puerto dinámico para que Render no falle en el escaneo de puertos
server.port=${PORT:8080}